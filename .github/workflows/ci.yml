name: ci

on:
  push:
    branches: [main, Bill]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas and data
        run: python scripts/validate_data.py

      - name: Run tests
        run: python -m pytest

      - name: Verify offline baseline pipeline and reproducibility
        run: python run_full_check.py
