name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas and data
        run: python scripts/validate_data.py

      - name: Check the P0 seeds rebuild byte-identically
        run: |
          python scripts/build_p0_seed.py
          python scripts/build_p0_v02.py
          python scripts/build_p0_uncertainty.py
          git diff --exit-code -- data/p0/p0_samples.json data/p0/p0_samples_v0.2.json data/p0/p0_samples_v0.3.json

      - name: Run tests
        run: python -m pytest
